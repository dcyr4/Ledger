async function addWorkExpense(){
  const desc = (workDraft.desc || '').trim();
  const amount = parseFloat(workDraft.amount);
  if(!desc){ toast('Add a description'); return; }
  if(!amount || amount <= 0){ toast('Enter a valid amount'); return; }
  const expense = {
    id: 'e_' + Date.now(),
    desc,
    amount,
    category: 'Work',
    card: workDraft.card || 'Amex',
    paidBy: currentUser || 1,
    splitP1: currentUser === 2 ? 0 : 1, // 100% the logger's — keeps it out of joint tracking
    date: workDraft.date || new Date().toISOString().slice(0,10),
    isWork: true,
    reimbursed: false
  };
  state.expenses.push(expense);
  const saved = await saveExpenses();
  if(!saved){ state.expenses = state.expenses.filter(e=>e.id !== expense.id); render(); return; }
  workDraft = { desc:"", amount:"", card: workDraft.card, date:"" };
  toast('Work expense added');
  render();
}

async function toggleWorkReimbursed(id){
  const e = state.expenses.find(x=>x.id===id);
  if(!e) return;
  const prev = e.reimbursed;
  e.reimbursed = !e.reimbursed;
  const saved = await saveExpenses();
  if(!saved){ e.reimbursed = prev; render(); return; }
  toast(e.reimbursed ? 'Marked reimbursed ✓' : 'Marked pending');
  render();
}

// Animates the swap between tabs: current view slides out, new one slides in.
// dir = 1 moves forward through TAB_ORDER, -1 moves back.
let tabTransitioning = false;
function transitionToTab(target, dir){
  if(tabTransitioning || target === activeTab) return;
  tabTransitioning = true;

  const ease = 'cubic-bezier(0.33,0,0.15,1)';
  appEl.style.transition = `transform 0.11s ${ease}, opacity 0.11s ${ease}`;
  appEl.style.transform = `translateX(${dir > 0 ? -22 : 22}px) scale(0.985)`;
  appEl.style.opacity = '0';

  setTimeout(()=>{
    activeTab = target;
    budgetEditMode = false;  // don't land mid-edit after switching
    render();
    window.scrollTo({top:0, behavior:'instant'});

    appEl.style.transition = 'none';
    appEl.style.transform = `translateX(${dir > 0 ? 22 : -22}px) scale(0.985)`;
    appEl.style.opacity = '0';

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        appEl.style.transition = `transform 0.26s ${ease}, opacity 0.2s ${ease}`;
        appEl.style.transform = 'translateX(0) scale(1)';
        appEl.style.opacity = '1';
        setTimeout(()=>{ tabTransitioning = false; }, 260);
      });
    });
  }, 110);
}

async function addExpense(){
  const amt = parseFloat(draft.amount);
  if(!draft.desc.trim()){ toast('Add a description first'); return; }
  if(!amt || amt <= 0){ toast('Enter a valid amount'); return; }

  let splitP1;
  if(draft.split === '50/50') splitP1 = 0.5;
  else if(draft.split === '100/0') splitP1 = 1;
  else if(draft.split === '0/100') splitP1 = 0;
  else if(draft.split === 'exact'){
    const p1Amt = parseFloat(draft.exactP1) || 0;
    if(p1Amt < 0 || p1Amt > amt){ toast(`${state.names.p1}'s amount can't exceed the total`); return; }
    splitP1 = amt > 0 ? p1Amt / amt : 0;
  }
  else splitP1 = draft.customP1 / 100;

  const expense = {
    id: 'e_' + Date.now(),
    desc: draft.desc.trim(),
    amount: draft.isReturn ? -Math.abs(amt) : amt,
    category: draft.category,
    card: draft.card,
    paidBy: draft.paidBy,
    splitP1: splitP1,
    date: draft.date || new Date().toISOString().slice(0,10),
    isReturn: draft.isReturn || false,
    payerModel: true   // marks this as a new-model entry (paidBy is meaningful: 1, 2, or 'joint')
  };
  state.expenses.push(expense);
  const saved = await saveExpenses();
  const wasReturn = draft.isReturn;
  draft = { desc:"", amount:"", category:draft.category, card:draft.card, paidBy:draft.paidBy, split:"50/50", customP1:50, exactP1:"", date:new Date().toISOString().slice(0,10), isReturn:false };
  if(saved){
    if(wasReturn){ toast('Return logged'); }
    else {
      const alert = getBudgetAlertMessage(expense);
      if(alert) toast(alert.msg, alert.type, 4500);
      else toast('Added to the ledger');
    }
  }
  // if saved is false, saveExpenses already showed the error toast — don't overwrite it
  render();
}

async function deleteExpense(id){
  const removed = state.expenses.find(e=>e.id === id);
  state.expenses = state.expenses.filter(e=>e.id !== id);
  const saved = await saveExpenses();
  if(!saved && removed) state.expenses.push(removed); // roll back locally if the save failed
  if(saved) toast('Removed');
  render();
}

function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});
}

function shiftMonth(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function monthExpenses(ym){
  return state.expenses.filter(e => !e.isSettlement && e.date.slice(0,7) === ym);
}

// A purchase is JOINT only when BOTH: it's in a joint category AND it's a shared split.
// Everything else — any non-joint category, or any 100%-one-person purchase — is personal.
// Work expenses are reimbursable business purchases and sit outside household tracking entirely.
function isJointExpense(e){
  if(e.category === 'Work') return false;
  if(e.paidBy === 'joint') return true;          // new-model joint purchase
  if(e.payerModel) return false;                 // new-model person purchase (belongs to a person)
  // legacy fallback: shared household category with a shared split
  return JOINT_CATS.includes(e.category) && !(e.splitP1 === 1 || e.splitP1 === 0);
}
function isPersonalExpense(e){
  if(e.category === 'Work') return false; // work purchases aren't personal household spending
  return !isJointExpense(e);
}
function jointMonthExpenses(ym){
  return monthExpenses(ym).filter(e => isJointExpense(e));
}
function personalMonthExpenses(personNum, ym){
  return monthExpenses(ym).filter(e=>{
    if(!isPersonalExpense(e)) return false;
    // A 100%-one-person purchase belongs only to that person.
    if(e.splitP1 === 1) return personNum === 1;
    if(e.splitP1 === 0) return personNum === 2;
    // A shared-split purchase in a non-joint category is shown to BOTH, each their share.
    return true;
  });
}
function personalMonthTotal(personNum, ym){
  return personalMonthExpenses(personNum, ym).reduce((s,e)=> s + personShareInExpense(e, personNum), 0);
}
function personalCategoryBreakdown(personNum, ym){
  const totals = {};
  personalMonthExpenses(personNum, ym).forEach(e=>{
    totals[e.category] = (totals[e.category]||0) + personShareInExpense(e, personNum);
  });
  return Object.entries(totals).sort((a,b)=> b[1]-a[1]);
}

// Joint-only versions used by the Data tab's main charts (personal purchases excluded)
function jointMonthTotal(ym){
  return jointMonthExpenses(ym).reduce((sum,e)=> sum + e.amount, 0);
}
function jointCategoryBreakdown(ym){
  const totals = {};
  jointMonthExpenses(ym).forEach(e=>{
    totals[e.category] = (totals[e.category]||0) + e.amount;
  });
  return Object.entries(totals).sort((a,b)=> b[1]-a[1]);
}
function jointCardBreakdown(ym){
  const totals = {};
  jointMonthExpenses(ym).forEach(e=>{
    const c = e.card || 'Other';
    totals[c] = (totals[c]||0) + e.amount;
  });
  return totals;
}

function personShareInExpense(e, personNum){
  return personNum === 1 ? e.amount * e.splitP1 : e.amount * (1 - e.splitP1);
}

function personMonthSpend(personNum, ym){
  return monthExpenses(ym).reduce((sum,e)=> sum + personShareInExpense(e, personNum), 0);
}

function flexMonthSpend(ym){
  // Budget tracks shared money only — 100%-personal purchases don't count against it.
  return jointMonthExpenses(ym).filter(e => FLEX_CATS.includes(e.category)).reduce((s,e)=>s+e.amount, 0);
}

function flexCategorySpend(ym, category){
  return jointMonthExpenses(ym).filter(e => e.category === category).reduce((s,e)=>s+e.amount, 0);
}

function fixedMonthSpend(ym){
  return jointMonthExpenses(ym).filter(e => FIXED_CATS.includes(e.category)).reduce((s,e)=>s+e.amount, 0);
}

function getSavedBudget(ym){
  return state.budgets[ym] || null;
}

function getBudgetForMonth(ym){
  if(state.budgets[ym]) return state.budgets[ym];
  let cursor = ym;
  for(let i=0;i<12;i++){
    cursor = shiftMonth(cursor, -1);
    if(state.budgets[cursor]) return state.budgets[cursor];
  }
  return null;
}

function budgetFixedSum(budget){
  return FIXED_CATS.reduce((s,c)=> s + ((budget.fixed && budget.fixed[c]) || 0), 0);
}

function budgetFlexTotal(budget){
  return Math.max(0, budget.income - budgetFixedSum(budget));
}

function categoryBudgetAmount(budget, category){
  if(FIXED_CATS.includes(category)) return (budget.fixed && budget.fixed[category]) || 0;
  // Prefer the exact dollar amount that was saved; fall back to percentage for older budgets
  if(budget.dollars && budget.dollars[category] != null) return budget.dollars[category];
  return budgetFlexTotal(budget) * ((budget.allocations[category]||0) / 100);
}

function getBudgetAlertMessage(expense){
  if(FIXED_CATS.includes(expense.category)) return null;
  if(isPersonalExpense(expense)) return null; // personal purchases don't count against the joint budget
  const ym = expense.date.slice(0,7);
  const budget = getBudgetForMonth(ym);
  if(!budget) return null;
  const flexTotal = budgetFlexTotal(budget);
  if(!(flexTotal > 0)) return null;

  // Category-level check first — most specific and most useful
  const catBudgetAmt = categoryBudgetAmount(budget, expense.category);
  const catSpent = flexCategorySpend(ym, expense.category);
  if(catBudgetAmt > 0){
    const catLeft = catBudgetAmt - catSpent;
    if(catLeft < 0){
      return {msg:`⚠ Over budget on ${expense.category} — $${fmt(Math.abs(catLeft))} past your $${fmt(catBudgetAmt)} limit this month`, type:'warn'};
    }
    if(catLeft <= BUDGET_ALERT_THRESHOLD){
      return {msg:`Heads up — only $${fmt(catLeft)} left of your $${fmt(catBudgetAmt)} ${expense.category} budget this month`, type:'caution'};
    }
  }

  // Fall back to the overall flexible budget
  const totalSpent = flexMonthSpend(ym);
  const totalLeft = flexTotal - totalSpent;
  if(totalLeft < 0){
    return {msg:`⚠ Over your overall budget — $${fmt(Math.abs(totalLeft))} past your $${fmt(flexTotal)} limit this month`, type:'warn'};
  }
  if(totalLeft <= BUDGET_ALERT_THRESHOLD){
    return {msg:`Heads up — only $${fmt(totalLeft)} left of your $${fmt(flexTotal)} flexible budget this month`, type:'caution'};
  }
  return null;
}

function monthOverMonthDelta(ym){
  const current = jointMonthTotal(ym);
  const prev = jointMonthTotal(shiftMonth(ym, -1));
  if(prev <= 0) return null;
  return ((current - prev) / prev) * 100;
}

function monthRangeLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const last = new Date(y, m, 0);
  const opts = {month:'short', day:'numeric'};
  return first.toLocaleDateString('en-US', opts) + ' – ' + last.toLocaleDateString('en-US', opts);
}

function buildConicGradient(breakdown, total){
  let acc = 0;
  const stops = breakdown.map(([cat, amt])=>{
    const start = (acc/total)*360;
    acc += amt;
    const end = (acc/total)*360;
    const color = CATEGORY_COLORS[cat] || '#8A8F98';
    return `${color} ${start}deg ${end}deg`;
  });
  return `conic-gradient(${stops.join(', ')})`;
}

function buildSimpleConicGradient(slices){
  const total = slices.reduce((s,x)=>s+x.amount,0);
  let acc = 0;
  const stops = slices.map(s=>{
    const start = (acc/total)*360;
    acc += s.amount;
    const end = (acc/total)*360;
    return `${s.color} ${start}deg ${end}deg`;
  });
  return `conic-gradient(${stops.join(', ')})`;
}

function exportCSV(){
  const n1 = state.names.p1, n2 = state.names.p2;
  const rows = [["Date","Description","Category","Card","Paid By","Total Amount",`${n1} Share`,`${n2} Share`,"Work Reimbursed"]];
  [...state.expenses].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const payer = e.paidBy==='joint' ? 'Joint account' : e.paidBy===1 ? n1 : n2;
    const p1Amt = e.amount * e.splitP1;
    const p2Amt = e.amount * (1 - e.splitP1);
    const reimb = e.category === 'Work' ? (e.reimbursed ? 'Reimbursed' : 'Pending') : '';
    rows.push([e.date, e.desc, e.category, e.card||'', payer, e.amount.toFixed(2), p1Amt.toFixed(2), p2Amt.toFixed(2), reimb]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `household-ledger-${selectedMonth}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

// ---------- Swipe navigation between tabs ----------
// Works best when launched from the iOS home screen, where Safari's own
// edge-swipe back/forward gesture is disabled.

(function setupSwipeNav(){
  let startX = 0, startY = 0, startTime = 0, tracking = false, dragging = false;

  const MIN_DISTANCE = 60;   // px horizontally before it counts as a swipe
  const MAX_VERTICAL = 60;   // px vertically — more than this and it's a scroll
  const MAX_DURATION = 800;  // ms — slower than this is a drag, not a swipe
  const DRAG_THRESHOLD = 12; // px before we start visually following the finger

  function canGo(dir){ // dir: 1 = next, -1 = previous
    const idx = TAB_ORDER.indexOf(activeTab);
    if(idx === -1) return false;
    const next = idx + dir;
    return next >= 0 && next < TAB_ORDER.length;
  }

  function resetTransform(animated){
    appEl.style.transition = animated ? 'transform 0.22s ease-out, opacity 0.22s ease-out' : 'none';
    appEl.style.transform = 'translateX(0)';
    appEl.style.opacity = '1';
  }

  function goToTab(dir){
    const idx = TAB_ORDER.indexOf(activeTab);
    const nextTab = TAB_ORDER[idx + dir];
    if(!nextTab) return;
    transitionToTab(nextTab, dir);
  }

  document.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;          // ignore pinch/multi-touch
    if(!authenticated) return;                   // no swiping on the login screen
    const t = e.target;
    // Don't hijack swipes that start on a slider or a text field
    if(t.closest('input[type=range], input, select, textarea')) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
    tracking = true;
    dragging = false;
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if(!tracking || !authenticated) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;

    // Once it's clearly a vertical scroll, stop tracking entirely
    if(!dragging && Math.abs(dy) > Math.abs(dx)){ tracking = false; return; }
    if(Math.abs(dx) < DRAG_THRESHOLD) return;

    dragging = true;
    const dir = dx < 0 ? 1 : -1;
    // Rubber-band if there's no tab in that direction, otherwise follow the finger
    const resistance = canGo(dir) ? 0.55 : 0.15;
    appEl.style.transition = 'none';
    appEl.style.transform = `translateX(${dx * resistance}px)`;
    appEl.style.opacity = String(Math.max(0.55, 1 - Math.abs(dx) / 500));
  }, {passive:true});

  document.addEventListener('touchend', e => {
    if(!tracking) return;
    tracking = false;
    if(!authenticated) return;

    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const elapsed = Date.now() - startTime;
    const wasDragging = dragging;
    dragging = false;

    const valid = elapsed <= MAX_DURATION
      && Math.abs(dy) <= MAX_VERTICAL
      && Math.abs(dx) >= MIN_DISTANCE;

    if(valid && canGo(dx < 0 ? 1 : -1)){
      goToTab(dx < 0 ? 1 : -1);
    } else if(wasDragging){
      resetTransform(true); // snap back into place
    }
  }, {passive:true});

  document.addEventListener('touchcancel', ()=>{
    tracking = false;
    if(dragging){ dragging = false; resetTransform(true); }
  }, {passive:true});
})();

document.getElementById('modalOverlay').onclick = (e)=>{
  if(e.target === document.getElementById('modalOverlay')) closeModal();
};

document.getElementById('refreshBtn').onclick = ()=> window.location.reload();
document.getElementById('signOutBtn').onclick = ()=>{
  if(!confirm('Sign out of this device?')) return;
  clearSession();
  renderRoot();
};

// ---- Light / dark theme ----
const THEME_KEY = 'dgledger_theme';
function applyTheme(theme){
  const btn = document.getElementById('themeBtn');
  if(theme === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
    if(btn){ btn.textContent = '☀'; btn.title = 'Switch to dark mode'; }
  } else {
    document.documentElement.removeAttribute('data-theme');
    if(btn){ btn.textContent = '☾'; btn.title = 'Switch to light mode'; }
  }
}
function initTheme(){
  let saved = 'dark';
  try{ saved = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
  applyTheme(saved);
}
document.getElementById('themeBtn').onclick = ()=>{
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
};
initTheme();

restoreSession(); // bring back an existing session before we render anything
loadState();
